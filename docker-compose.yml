services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: assessflow
      POSTGRES_USER: assessflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessflow_local}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-assessflow_local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-assessflow_local_secret}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["minio_data:/data"]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  minio_data:
