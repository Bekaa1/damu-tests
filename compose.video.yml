name: assessflow-video-local
services:
  video-redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56380:6379"]
  livekit:
    image: livekit/livekit-server:v1.13.11
    depends_on: [video-redis]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          node_ip: ${LIVEKIT_NODE_IP:?Set the IPv4 address reachable by the browser and Docker}
          use_external_ip: false
          tcp_port: 7881
          udp_port: 7882
        redis:
          address: video-redis:6379
        keys:
          ${LIVEKIT_API_KEY:?Set the LiveKit API key}: ${LIVEKIT_API_SECRET:?Set the LiveKit secret}
    ports:
      - "127.0.0.1:7880:7880"
      - "${LIVEKIT_NODE_IP}:7881:7881"
      - "${LIVEKIT_NODE_IP}:7882:7882/udp"
  egress:
    image: livekit/egress:v1.15.0
    depends_on: [livekit]
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: video-redis:6379
    volumes:
      - ${VIDEO_RECORDINGS_DIR:-./.data/video-recordings}:/out
